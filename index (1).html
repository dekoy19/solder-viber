<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Рахунок → Viber</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f5f5f7; color: #111; margin: 0; }
  .box { max-width: 480px; margin: 24px auto; padding: 0 16px; }
  h3 { margin: 0 0 6px; }
  .step { color: #666; font-size: 14px; margin: 18px 0 6px; }
  a.btn, button.btn { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #7360f2;
      color: #fff; padding: 16px; border: 0; border-radius: 12px; font-size: 18px; text-decoration: none; }
  button.btn:disabled { background: #b9b2ee; }
  #status { font-size: 14px; color: #666; margin-top: 8px; min-height: 18px; }
  a.small { display: inline-block; margin-top: 8px; font-size: 15px; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font-size: 15px; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <h3 id="title">Рахунок у Viber</h3>

  <div class="step">Крок 1 — відкрий чат і надішли текст:</div>
  <a class="btn" id="open" href="#">💬 Відкрити чат у Viber</a>

  <div class="step">Крок 2 — повернись сюди і надішли файл (клієнт буде першим у списку Viber):</div>
  <button class="btn" id="share" disabled>📎 Надіслати PDF файлом</button>
  <div id="status">Завантажую PDF…</div>
  <a class="small" id="dl" style="display:none">⬇️ Завантажити PDF на телефон</a>

  <div class="step">Якщо текст не підставився — скопіюй:</div>
  <textarea id="txt" readonly onclick="this.select()"></textarea>
</div>
<script>
  // Дані після # не йдуть на сервер GitHub — лише в браузер.
  var p = new URLSearchParams(location.hash.slice(1));
  var phone = (p.get('n') || '').replace(/\D/g, '');
  var text = p.get('t') || '';
  var key = p.get('k') || '';
  var webapp = p.get('w') || '';
  var t = encodeURIComponent(text);
  var $ = function (id) { return document.getElementById(id); };

  $('title').textContent = phone ? 'Рахунок → +' + phone : 'Немає номера в посиланні';
  $('open').href = 'viber://chat?number=%2B' + phone + '&draft=' + t + '&text=' + t;
  $('txt').value = text;

  var pdfFile = null;
  function setStatus(s) { $('status').textContent = s; }

  // PDF завантажуємо одразу, щоб «Поділитися» відкрилось миттєво після натискання
  if (key && webapp) {
    fetch(webapp + '?pdf=' + encodeURIComponent(key))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.b64) throw new Error(j.error || 'порожня відповідь');
        var bin = atob(j.b64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        pdfFile = new File([bytes], j.name || 'rahunok.pdf', { type: 'application/pdf' });
        var url = URL.createObjectURL(pdfFile);
        $('dl').href = url; $('dl').download = pdfFile.name; $('dl').style.display = 'inline-block';
        if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
          $('share').disabled = false; setStatus('PDF готовий ✓');
        } else {
          setStatus('Цей браузер не вміє ділитися файлами — завантаж PDF і прикріпи в Viber вручну.');
        }
      })
      .catch(function (e) { setStatus('Не вдалось завантажити PDF: ' + e.message); });
  } else {
    setStatus('У посиланні немає PDF.');
  }

  $('share').onclick = function () {
    if (!pdfFile) return;
    navigator.share({ files: [pdfFile] })
      .then(function () { setStatus('Готово ✓'); })
      .catch(function (e) { if (e.name !== 'AbortError') setStatus('Помилка: ' + e.message); });
  };
</script>
</body>
</html>
